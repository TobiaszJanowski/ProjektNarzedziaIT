name: Build EXE

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 12 * * 0' 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: ./installResources.ps1
      - name: Build with PyInstaller
        run: python -m PyInstaller --onefile --noconsole --add-data "converter.py;." ui.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: converter-exe
          path: dist/ui.exe